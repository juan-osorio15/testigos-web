<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imagen para compartir · panelista</title>
<style>
  /* Vista previa de una ficha de panelista, 1200 × 630: la foto en b/n con
     grano sobre un bloque de color, el nombre y la credencial en tinta
     sobre crema, y la franja cielo con el evento, fechas y lugar. Misma
     gramática que og.html. Los marcadores {{…}} los rellena make-og.mjs. */
  @font-face { font-family: 'Archivo'; src: url('../../src/assets/fonts/archivo-var.woff2') format('woff2-variations'); font-weight: 100 900; }
  @font-face { font-family: 'Fraunces'; src: url('../../src/assets/fonts/fraunces-var-italic.woff2') format('woff2-variations'); font-weight: 100 900; font-style: italic; }
  :root {
    --ink: #210804; --cream: #efe8df; --terracotta: #d45b30; --sky: #74b3d6; --olive: #757522; --brick: #7d290d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    grid-template-columns: 470px 730px;
    grid-template-rows: 542px 88px;
    font-family: 'Archivo', sans-serif;
    color: var(--ink);
    background: var(--cream);
  }
  .photo { background: var(--{{tone}}); position: relative; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center top; filter: grayscale(1) sepia(0.18) contrast(1.18) brightness(1.04); }
  .photo::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 180px 180px; mix-blend-mode: overlay; opacity: 0.75;
  }
  .msg { padding: 54px 56px 0; display: flex; flex-direction: column; }
  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--brick);
  }
  .eyebrow::before { content: ''; width: 24px; height: 2px; background: currentColor; }
  h1 { margin-top: 26px; font-size: 64px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  .credential { margin-top: 22px; font-size: 22px; font-weight: 700; line-height: 1.35; max-width: 30ch; text-transform: uppercase; letter-spacing: .04em; }
  .serif { margin-top: auto; margin-bottom: 40px; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 30px; color: var(--brick); }
  .strip {
    grid-column: 1 / -1;
    background: var(--sky);
    display: flex; align-items: center; gap: 18px;
    padding: 0 56px;
  }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .num { margin-left: auto; font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .label { font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .label .sep { font-weight: 500; }
</style>
</head>
<body>
  <div class="photo"><img src="{{photo}}" alt=""></div>
  <div class="msg">
    <p class="eyebrow">Panelista</p>
    <h1>{{name}}</h1>
    <p class="credential">{{credential}}</p>
    <p class="serif">Testigos de la Memoria</p>
  </div>
  <div class="strip">
    <span class="brand">Testigos de la Memoria</span>
    <span class="num">5–8</span>
    <span class="label">noviembre 2026 <span class="sep">·</span> Villa de Leyva, Colombia</span>
  </div>
</body>
</html>
