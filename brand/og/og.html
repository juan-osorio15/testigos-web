<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imagen para compartir · Testigos de la Memoria</title>
<style>
  /* Imagen de vista previa (WhatsApp, Facebook, X, Google): el hero del
     sitio a 1200 × 630, sin header, sin contador y sin nada que caduque.
     Misma gramática que brand/formula-visual.md: bloques que se tocan,
     tinta sobre terracota, logo en crema, foto en duotono, datos en franja
     cielo. Se captura con make.sh. */
  @font-face { font-family: 'Archivo'; src: url('../../src/assets/fonts/archivo-var.woff2') format('woff2-variations'); font-weight: 100 900; }
  @font-face { font-family: 'Fraunces'; src: url('../../src/assets/fonts/fraunces-var-italic.woff2') format('woff2-variations'); font-weight: 100 900; font-style: italic; }
  :root {
    --ink: #210804; --cream: #efe8df; --terracotta: #d45b30; --sky: #74b3d6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    grid-template-columns: 700px 500px;
    grid-template-rows: 542px 88px;
    font-family: 'Archivo', sans-serif;
    color: var(--ink);
    background: var(--cream);
  }
  .msg {
    background: var(--terracotta);
    padding: 54px 56px 0;
    display: flex; flex-direction: column;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  }
  .eyebrow::before { content: ''; width: 24px; height: 2px; background: currentColor; }
  h1 { margin-top: 22px; font-size: 62px; line-height: 1.0; font-weight: 800; letter-spacing: -.02em; }
  h1 span { display: block; }
  h1 .serif { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; color: var(--cream); letter-spacing: 0; padding-top: 4px; }
  .pitch { margin-top: 26px; font-size: 20px; font-weight: 600; line-height: 1.4; max-width: 32ch; }
  .side { display: grid; grid-template-rows: 250px 292px; }
  .brand { background: var(--cream); display: grid; place-items: center; }
  .brand svg { width: 250px; height: auto; color: var(--ink); }
  .photo { background: var(--cream); overflow: hidden; } /* tinte crema, como .hero-photo */
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; filter: grayscale(1) contrast(1.06) brightness(1.02); mix-blend-mode: multiply; }
  .strip {
    grid-column: 1 / -1;
    background: var(--sky);
    display: flex; align-items: center; gap: 18px;
    padding: 0 56px;
  }
  .num { font-size: 42px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .label { font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .label .sep { font-weight: 500; }
  .cta {
    margin-left: auto;
    background: var(--terracotta); color: var(--ink);
    font-size: 19px; font-weight: 800; padding: 17px 30px;
  }
</style>
</head>
<body>
  <div class="msg">
    <p class="eyebrow">Periodistas en la Historia</p>
    <h1>
      <span>La historia reciente</span>
      <span>de Colombia, contada</span>
      <span>por quienes</span>
      <span class="serif">la viven de frente.</span>
    </h1>
    <p class="pitch">Cuatro días. Más de diez periodistas. Una conversación que no se repite.</p>
  </div>
  <div class="side">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="110 111 385 235"><use href="../../src/assets/logo/logo-lockup.svg#lockup"/></svg>
    </div>
    <div class="photo"><img src="../../src/assets/photos/pexels-enzo-renz-424999667-33786545.jpg" alt=""></div>
  </div>
  <div class="strip">
    <span class="num">5–8</span>
    <span class="label">noviembre 2026 <span class="sep">·</span> Villa de Leyva, Colombia</span>
    <span class="cta">Comprar boletas</span>
  </div>
</body>
</html>
