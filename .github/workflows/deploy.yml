# Deploy a GitHub Pages con build de Astro (opción (a) del brief, R8).
#
# INERTE POR DISEÑO mientras viva solo en `dev`: dispara únicamente en push
# a `main` (que requiere autorización explícita del usuario) o a mano.
# Requiere además cambiar Pages a Source: "GitHub Actions" — acción manual
# del usuario documentada en specs/001-event-landing/quickstart.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
