<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testigos de la Memoria — Próximamente</title>
    <meta
      name="description"
      content="Testigos de la Memoria — sitio oficial, próximamente en línea."
    />
    <meta name="theme-color" content="#d45b30" />
    <link rel="canonical" href="https://testigosdelamemoria.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Testigos de la Memoria" />
    <meta property="og:title" content="Testigos de la Memoria — Próximamente" />
    <meta
      property="og:description"
      content="Testigos de la Memoria — sitio oficial, próximamente en línea."
    />
    <meta property="og:url" content="https://testigosdelamemoria.com/" />
    <meta property="og:locale" content="es_ES" />
    <meta
      property="og:image"
      content="https://testigosdelamemoria.com/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Testigos de la Memoria",
        "url": "https://testigosdelamemoria.com/",
        "logo": "https://testigosdelamemoria.com/assets/logo.svg"
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        background-color: #d45b30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2rem;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        text-align: center;
      }

      .logo {
        width: min(320px, 70vw);
        height: auto;
        display: block;
      }

      h1 {
        color: #fff1c7;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: normal;
        letter-spacing: 0.08em;
      }

      /* Fuera del flujo: los puntos no ocupan ancho y la palabra queda centrada sola */
      .dots {
        position: absolute;
      }

      .dots span {
        animation: dot-blink 1.8s infinite;
        opacity: 0;
      }

      .dots span:nth-child(2) {
        animation-delay: 0.3s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.6s;
      }

      @keyframes dot-blink {
        0% {
          opacity: 0;
        }
        30%,
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dots span {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="assets/logo.svg" alt="Testigos de la Memoria" />
    <h1>
      Próximamente<span class="dots"
        ><span>.</span><span>.</span><span>.</span></span
      >
    </h1>
  </body>
</html>
