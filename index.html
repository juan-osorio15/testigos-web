<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testigos de la Memoria — Próximamente</title>
  <meta name="description" content="Testigos de la Memoria. Próximamente.">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #d45b30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .logo {
      width: min(320px, 70vw);
      height: auto;
      display: block;
    }

    h1 {
      color: #FFF1C7;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .dots span {
      animation: dot-blink 1.8s infinite;
      opacity: 0;
    }

    .dots span:nth-child(2) { animation-delay: 0.3s; }
    .dots span:nth-child(3) { animation-delay: 0.6s; }

    @keyframes dot-blink {
      0%       { opacity: 0; }
      30%, 70% { opacity: 1; }
      100%     { opacity: 0; }
    }
  </style>
</head>
<body>
  <img class="logo" src="assets/logo.svg" alt="Testigos de la Memoria">
  <h1>Proximamente<span class="dots"><span>.</span><span>.</span><span>.</span></span></h1>
</body>
</html>
